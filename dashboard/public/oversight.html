<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ironclad Compliance - Partner Oversight</title><link rel="icon" href="data:,">
<style>
:root{font-family:-apple-system,"Segoe UI",Arial,sans-serif;color:#172033;background:#f5f7fa;--navy:#1a365d;--line:#dce3ec;--muted:#667085}*{box-sizing:border-box}body{margin:0}header{background:var(--navy);color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}header a{color:#dbeafe}main{max-width:1180px;margin:0 auto;padding:24px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:block;font-size:13px;font-weight:600;color:var(--muted)}input,select,textarea{width:100%;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}textarea{min-height:78px}button{background:#2c5282;color:white;border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}.meta{color:var(--muted);font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.records{display:grid;gap:10px}.record{border:1px solid var(--line);border-radius:8px;padding:12px}.record h3{margin:0 0 4px;font-size:16px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;border-radius:12px;background:#edf2f7;padding:3px 8px}.risk-high{background:#fed7d7;color:#822727}.risk-medium{background:#feebc8;color:#744210}.risk-low{background:#c6f6d5;color:#22543d}[hidden]{display:none!important}.error{background:#fff5f5;color:#822727;border:1px solid #feb2b2;border-radius:8px;padding:12px}
</style></head><body>
<header><div><strong>Ironclad Compliance</strong><div style="font-size:13px;color:#cbd5e0">Partner & Integration Oversight</div></div><a href="/">Back to compliance dashboard</a></header>
<main><div id="error" class="error" hidden></div><section class="card"><div class="toolbar"><div><h2 style="margin:0">Tenant workspace</h2><div id="identity" class="meta">Loading signed-in tenantâ€¦</div></div></div></section>
<section id="edit-panel" class="card" hidden><h2>Add oversight record</h2><form id="oversight-form"><div class="grid">
<label class="field">Record type<select name="record_type"><option value="partner">Partner / vendor</option><option value="integration">Integration</option></select></label>
<label class="field">Name<input name="name" required maxlength="120"></label><label class="field">Business owner<input name="business_owner" maxlength="120"></label><label class="field">Technical owner<input name="technical_owner" maxlength="120"></label>
<label class="field">Status<select name="status"><option>Active</option><option>Onboarding</option><option>Under review</option><option>Pending information</option><option>Offboarding</option></select></label>
<label class="field">Risk<select name="risk"><option>Unrated</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label>
<label class="field">Data access<select name="data_access"><option>PHI</option><option>PII</option><option>Operational only</option><option>No production data</option></select></label>
<label class="field">PHI scope<input name="phi_scope" placeholder="Demographics, clinical notes, DICOM images?"></label>
<label class="field">Data direction<select name="data_flow_direction"><option>Bidirectional</option><option>Outbound / push</option><option>Inbound / pull</option><option>Unidirectional</option></select></label>
<label class="field">Agreement status<select name="agreement_status"><option>Pending review</option><option>Required - pending</option><option>Executed</option><option>Not required</option></select></label>
<label class="field">BAA status<select name="baa_status"><option>Pending review</option><option>Required - pending</option><option>Executed</option><option>Not required</option></select></label>
<label class="field">BAA execution date<input name="baa_execution_date" type="date"></label>
<label class="field">BAA / contract reference<input name="baa_document_ref" placeholder="Evidence or contract reference"></label>
<label class="field">Review due<input name="review_due" type="date"></label><label class="field">Integration method<input name="integration_method" placeholder="API, HL7, SFTP, VPN, manualâ€¦"></label>
</div><label class="field" style="margin-top:12px">Purpose / notes<textarea name="notes"></textarea></label><div style="margin-top:14px"><button type="submit">Save record</button></div></form></section>
<section class="card"><h2>Partners & vendors</h2><div id="partners" class="records"><div class="meta">Loadingâ€¦</div></div></section><section class="card"><h2>Integrations</h2><div id="integrations" class="records"><div class="meta">Loadingâ€¦</div></div></section></main>
<script src="/config.js"></script><script type="module" src="/oversight.js"></script></body></html>
