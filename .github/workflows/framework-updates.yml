name: Framework Update Checker

# Quarterly watch on the official sources. Opens a PR only when something
# actually changed: a version token higher than the one this repository tracks,
# or a change in the source page's content fingerprint since the last run. The
# fingerprints are committed alongside the PR, so the next run compares against
# what was really seen rather than re-reporting the same change every quarter.

on:
  schedule:
    # 00:00 UTC on the first of January, April, July and October.
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      framework:
        description: 'Framework to check'
        required: false
        type: choice
        options:
          # 'all' rather than an empty default: a workflow_dispatch choice
          # option cannot be the empty string, GitHub rejects the file outright.
          # The checker treats 'all' and '' identically.
          - all
          - soc2
          - nist-csf
          - pci-dss
          - hipaa
        default: all
      open_pr:
        description: 'Open a PR even if nothing changed'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: framework-updates
  cancel-in-progress: false

jobs:
  check:
    name: Check the official sources
    runs-on: ubuntu-latest
    outputs:
      updates_found: ${{ steps.check.outputs.updates_found }}
      frameworks: ${{ steps.check.outputs.frameworks }}
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTTP support
        # The checker parses HTML with the standard library; only the fetch
        # needs a dependency.
        run: pip install --quiet requests

      - name: Check for framework updates
        id: check
        run: |
          set -euo pipefail
          python scripts/check_framework_updates.py \
            --framework "${{ inputs.framework || 'all' }}" \
            --output updates.json \
            --state frameworks/framework-check-state.json

          python scripts/validate_artifacts.py updates.json

          {
            echo "updates_found=$(jq -r '.updates_found' updates.json)"
            echo "frameworks=$(jq -r '.frameworks | join(", ")' updates.json)"
          } >> "$GITHUB_OUTPUT"

          {
            echo 'summary<<SUMMARY_EOF'
            jq -r '.checks[] | "- **\(.name)** — \(.status): \(if .error != "" then .error else .detail end)"' updates.json
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report to the run summary
        run: |
          {
            echo "## Framework update check"
            echo
            echo "${{ steps.check.outputs.summary }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: update-check-results
          path: updates.json
          retention-days: 90

      - name: Open a pull request
        if: steps.check.outputs.updates_found == 'true' || inputs.open_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(frameworks): record a change at the official sources'
          title: '[Auto] Framework change detected at the source'
          body: |
            The quarterly source check found a change.

            ### What changed
            ${{ steps.check.outputs.summary }}

            ### What this PR contains
            Only the updated source fingerprints. **No control text has been
            changed** — the checker never edits a control set, because a
            regulator's wording is not something to transcribe automatically.

            ### Before merging
            - [ ] Read the published document at the source
            - [ ] Update the affected `frameworks/*.json` control text and points of focus
            - [ ] Update `current_version` in `frameworks/framework-versions.json`
            - [ ] Review the crosswalks in `frameworks/crosswalks/` for controls that moved
            - [ ] Run `python scripts/validate_artifacts.py`
          branch: framework-updates-${{ github.run_number }}
          add-paths: |
            frameworks/framework-check-state.json
          labels: |
            compliance
            auto-generated
