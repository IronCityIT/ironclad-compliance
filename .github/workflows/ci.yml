name: CI

# The same gates the Jenkins pipeline runs, so a change is checked whichever
# route it takes. Jenkinsfile is the authority on the gate order; keep the two
# in step.

on:
  push:
    branches: [main, 'productize/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: pip install --quiet -r requirements-dev.txt

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest --cov=ironclad --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Validate artifacts
        run: python scripts/validate_artifacts.py

      - name: Build
        run: |
          set -euo pipefail
          pip install --quiet build
          python -m build

      - name: Smoke test the built package
        run: |
          set -euo pipefail
          python -m ironclad.cli list-modules > /dev/null
          python -m ironclad.cli list-frameworks > /dev/null
          for framework in soc2 nist-csf pci-dss hipaa; do
            python -m ironclad.cli validate --framework "$framework"
          done

      - name: Upload the test report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml
          retention-days: 14
