name: Compliance Assessment

# Runs one compliance assessment for one client against one framework.
#
# The AI analysis is not done here. Findings go to IronCityIT/consensus-engine
# via workflow_call, which is the one place LLM logic lives across every ICIT
# product. Its contract takes `findings_json` as BASE64 and returns exactly one
# output, `consensus_b64` — the engine CLI writes the base64 payload for us and
# decodes the response, so no step has to hand-roll either in shell.

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client identifier'
        required: true
        type: string
      framework:
        description: 'Compliance framework to assess'
        required: true
        type: choice
        options:
          - soc2
          - nist-csf
          - pci-dss
          - hipaa
      evidence_path:
        description: 'Evidence location — only used by the retired GCS path'
        required: false
        type: string
        default: ''
      assessment_type:
        description: 'Which deliverable to issue (everything is always assessed)'
        required: false
        type: choice
        options:
          - full
          - gap-only
          - readiness
        default: full
      group:
        description: 'Capability group to run'
        required: false
        type: choice
        options:
          - deep
          - standard
          - quick
        default: deep

permissions:
  contents: read

concurrency:
  # One assessment per client and framework at a time. Two concurrent runs would
  # race on the same Firestore document and one would overwrite the other.
  group: assessment-${{ inputs.client_id }}-${{ inputs.framework }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate inputs and framework
    runs-on: ubuntu-latest
    outputs:
      assessment_id: ${{ steps.plan.outputs.assessment_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate the client identifier
        env:
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          # Via env, never interpolated into the script body: a client id with
          # shell metacharacters must not be able to execute here.
          if ! printf '%s' "$CLIENT_ID" | grep -Eq '^[A-Za-z0-9 _-]{1,64}$'; then
            echo "::error::client_id must be 1-64 characters of letters, digits, space, hyphen or underscore"
            exit 1
          fi

      - name: Validate the framework definition
        run: python -m ironclad.cli validate --framework "${{ inputs.framework }}"

      - name: Plan the run
        id: plan
        env:
          CLIENT_ID: ${{ inputs.client_id }}
          FRAMEWORK: ${{ inputs.framework }}
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$CLIENT_ID" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//; s/-*$//')
          echo "assessment_id=${slug}-${FRAMEWORK}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

  assess:
    name: Assess controls
    needs: prepare
    runs-on: ubuntu-latest

    # `secrets` is not an available context in a step-level `if`, so the
    # evidence source is selected on env set here. Presence checks only; no step
    # below ever echoes a value.
    env:
      IRONCLAD_EVIDENCE_ROOT: ${{ secrets.IRONCLAD_EVIDENCE_ROOT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    outputs:
      findings_b64: ${{ steps.assess.outputs.findings_b64 }}
      readiness: ${{ steps.assess.outputs.readiness }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install evidence extraction support
        # The engine core is stdlib-only. These are needed only to read binary
        # evidence formats, so they are installed for this job alone.
        #
        # pypdf rather than PyPDF2: the latter announces its own deprecation on
        # import and no longer receives fixes, and this parser is pointed at
        # documents a client uploads. The extractor accepts either.
        run: pip install --quiet pypdf python-docx openpyxl

      # Evidence comes from a NAS-backed volume, one prefix per tenant. The
      # tenant-prefix rule is in `ironclad evidence stage` rather than in shell:
      # a containment check written here is a --recursive away from reading
      # another client's documents, and nothing tests shell. It refuses a
      # traversal, a symlink out of the prefix, and an empty prefix — the last
      # because a fetch that silently produced nothing used to make the
      # assessment report every control as a gap.
      - name: Stage the client evidence
        if: env.IRONCLAD_EVIDENCE_ROOT != ''
        env:
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          python -m ironclad.cli evidence stage --client "$CLIENT_ID" --out evidence/

      # RETIRED PATH. GCS fetch, kept only while no evidence volume is reachable
      # from the runner. It goes with the rest of the GCP surface once the
      # transport in HANDOFF.md §3.2 is decided.
      - id: auth
        if: env.IRONCLAD_EVIDENCE_ROOT == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: env.IRONCLAD_EVIDENCE_ROOT == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch the client evidence from storage
        if: env.IRONCLAD_EVIDENCE_ROOT == '' && env.GCP_SA_KEY != ''
        env:
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          # No `|| true` here. A failed fetch used to leave an empty directory
          # and the assessment reported every control as a gap, which reads as a
          # catastrophic client result rather than a broken download.
          gcloud storage cp --recursive "${EVIDENCE_PATH%/}/*" evidence/
          count=$(find evidence -type f | wc -l)
          echo "fetched $count evidence file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no evidence files were fetched from $EVIDENCE_PATH"
            exit 1
          fi

      - name: Refuse to assess with no evidence source
        if: env.IRONCLAD_EVIDENCE_ROOT == '' && env.GCP_SA_KEY == ''
        run: |
          echo "::error::no evidence source is configured — set IRONCLAD_EVIDENCE_ROOT \
          to a mounted volume. See HANDOFF.md §3.2."
          exit 1

      - name: Run the assessment
        id: assess
        env:
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          python -m ironclad.cli assess \
            --client "$CLIENT_ID" \
            --framework "${{ inputs.framework }}" \
            --evidence-dir evidence/ \
            --group "${{ inputs.group }}" \
            --assessment-type "${{ inputs.assessment_type }}" \
            --assessment-id "${{ needs.prepare.outputs.assessment_id }}" \
            --out out/

          # The consensus engine takes base64; the CLI already wrote it.
          echo "findings_b64=$(cat out/findings.b64)" >> "$GITHUB_OUTPUT"
          echo "readiness=$(jq -r '.summary.readiness_score' out/assessment.json)" >> "$GITHUB_OUTPUT"

      - name: Upload the assessment
        uses: actions/upload-artifact@v4
        with:
          name: assessment
          path: out/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Central AI consensus. One source of truth for LLM analysis; nothing here
  # embeds or duplicates it.
  # ---------------------------------------------------------------------------
  ai-consensus:
    name: AI consensus analysis
    needs: assess
    uses: IronCityIT/consensus-engine/.github/workflows/analyze.yml@main
    with:
      findings_json: ${{ needs.assess.outputs.findings_b64 }}
      product: ironclad-compliance
      client_id: ${{ inputs.client_id }}
      # Regulated evidence: the result is stored through our own Firestore path,
      # never posted to the legacy QNAP ingest API.
      post_to_api: false
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  report:
    name: Report and publish
    needs: [prepare, assess, ai-consensus]
    # Runs even when the AI stage failed: the assessment itself is complete and
    # withholding the client's report over missing optional commentary would be
    # the wrong trade. The report states that commentary was unavailable.
    if: always() && needs.assess.result == 'success'
    runs-on: ubuntu-latest

    # The `secrets` context is not available in a step-level `if`, so the two
    # publish paths are selected on env set here. Written as a presence check,
    # never as a value: nothing below ever echoes either one.
    env:
      IRONCLAD_STORE: ${{ secrets.IRONCLAD_STORE }}
      IRONCLAD_ARTIFACTS: ${{ secrets.IRONCLAD_ARTIFACTS }}
      STORE_RESULTS_URL: ${{ secrets.STORE_RESULTS_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: assessment
          path: out/

      - name: Fold in the AI consensus
        env:
          CONSENSUS_B64: ${{ needs.ai-consensus.outputs.consensus_b64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          from ironclad.cli import _StoredResult
          from ironclad.engine import merge_consensus

          path = pathlib.Path("out/assessment.json")
          document = json.loads(path.read_text())
          result = _StoredResult(document)
          consensus = merge_consensus(result, os.environ.get("CONSENSUS_B64", ""))
          document["consensus"] = consensus
          document.setdefault("warnings", []).extend(result.warnings)
          path.write_text(json.dumps(document, indent=2) + "\n")
          print("consensus status:", consensus.get("status"))
          PY

      - name: Render the report and the auditor package
        env:
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          python -m ironclad.cli report \
            --input out/assessment.json \
            --out out/report.html \
            --client-name "$CLIENT_ID"
          python -m ironclad.cli export \
            --input out/assessment.json \
            --format package \
            --out out/package/

      - name: Validate the artifacts before publishing
        run: python scripts/validate_artifacts.py out/assessment.json out/package/package.json

      - name: Upload the deliverables
        uses: actions/upload-artifact@v4
        with:
          name: assessment-report
          path: |
            out/report.html
            out/package/
          retention-days: 90

      # The target sink: a NAS-backed volume or MariaDB, named by one target
      # string. Skipped rather than failed when IRONCLAD_STORE is unset, because
      # the transport to the NAS is not decided yet (see HANDOFF.md §3.2) and an
      # assessment that ran is still worth its uploaded artifacts.
      - name: Publish to the store
        if: env.IRONCLAD_STORE != ''
        run: |
          set -euo pipefail
          python -m ironclad.cli store health
          # The record and the deliverables. The report a client is issued and
          # the auditor package go to the artifact volume, checksummed, so what
          # was issued can later be shown to be what is stored.
          python -m ironclad.cli store publish \
            --input out/assessment.json \
            --artifacts out/

      - name: Note that no store is configured
        if: env.IRONCLAD_STORE == ''
        run: |
          echo "::warning::IRONCLAD_STORE is not configured — the result is in \
          this run's artifacts only. See HANDOFF.md §3.2."

      # RETIRED PATH. The Cloud Function ingest that wrote Firestore. Kept only
      # while a store is not yet configured, and only when its secret is set;
      # it goes with functions/ once the transport above is decided.
      - name: Publish to the legacy ingest
        if: env.IRONCLAD_STORE == '' && env.STORE_RESULTS_URL != ''
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          python scripts/store_results.py \
            --client-id "$CLIENT_ID" \
            --assessment-id "${{ needs.prepare.outputs.assessment_id }}" \
            --results-dir out/ \
            --report-dir out/

      - name: Summary
        env:
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          {
            echo "## Compliance assessment complete"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Client | $CLIENT_ID |"
            echo "| Framework | ${{ inputs.framework }} |"
            echo "| Assessment | \`${{ needs.prepare.outputs.assessment_id }}\` |"
            echo "| Readiness | ${{ needs.assess.outputs.readiness }}% |"
            echo "| AI commentary | ${{ needs.ai-consensus.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
